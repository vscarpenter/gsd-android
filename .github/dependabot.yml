# Dependabot version updates. Gradle covers the plugins and libraries in
# gradle/libs.versions.toml and the module build files. Workflow actions
# under .github/workflows are pinned by SHA by hand and are not listed here.
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
